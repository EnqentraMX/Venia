# El sitio ya vive en https://liclink.com.mx (Cloudflare).
# Si Netlify vuelve a publicar este repositorio, todo se redirige de forma permanente al dominio nuevo,
# para que Google pase las visitas y la posición a liclink.com.mx.
[build]
  publish = "public"

[[redirects]]
  from = "/*"
  to = "https://liclink.com.mx/:splat"
  status = 301
  force = true
